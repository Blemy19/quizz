<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Cuánto me conoces, mi amor?</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrolling for the background effect */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffc3a0 100%);
            background-size: 300% 300%;
            animation: gradientMove 12s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(255, 136, 170, 0.3);
            border-radius: 1.5rem;
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.7);
            user-select: none;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Transitions for screens */
        .screen-transition {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        .hide-screen {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }
        
        .show-screen {
            opacity: 1;
            transform: scale(1);
            position: relative;
            visibility: visible;
        }

        /* Option buttons styling */
        .option-btn {
            transition: all 0.3s ease;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            transform: none !important;
        }
    </style>
</head>
<body class="text-gray-800 p-4 relative">

    <!-- Background Hearts Container -->
    <div id="hearts-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

    <div id="screen-start" class="glass-panel w-full max-w-md p-8 md:p-10 text-center screen-transition show-screen z-10 mx-auto">
        <div class="text-6xl mb-4 animate-bounce">💌</div>
        <h1 class="text-4xl md:text-5xl font-bold text-rose-600 mb-2 font-cursive leading-tight">
            ¿Cuánto me conoces, mi amor?
        </h1>
        <p class="text-gray-600 text-sm mb-8 mt-2">Un pequeño juego hecho con mucho amor para ti.</p>
        
        <div class="space-y-4">
            <div class="text-left">
                <label for="username" class="block text-sm font-medium text-pink-700 mb-1 ml-1">Tu hermoso nombre:</label>
                <input type="text" id="username" placeholder="Ingresa tu nombre..." class="w-full px-4 py-3 rounded-xl border-2 border-pink-200 focus:border-rose-400 focus:ring-4 focus:ring-rose-100 outline-none transition-all duration-300 text-gray-700 bg-white/90">
                <p id="name-error" class="text-rose-500 text-xs mt-1 ml-1 hidden">Amor, necesitas poner tu nombre ❤️</p>
            </div>
            <button onclick="startQuiz()" class="w-full bg-gradient-to-r from-rose-400 to-pink-500 hover:from-rose-500 hover:to-pink-600 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg hover:shadow-pink-300/50 transform hover:-translate-y-1 transition-all duration-300 text-lg">
                Empezar ✨
            </button>
        </div>
    </div>

    <div id="screen-quiz" class="glass-panel w-full max-w-lg p-6 md:p-8 screen-transition hide-screen z-10 mx-auto">
        <div class="flex justify-between items-center mb-6 border-b border-pink-200 pb-3">
            <span class="text-sm font-semibold text-rose-600 bg-white/50 px-3 py-1 rounded-full" id="question-counter">1/10</span>
            <span class="text-sm font-bold text-pink-500 flex items-center">
                ❤️ <span id="current-score" class="ml-1">0</span>
            </span>
        </div>
        
        <h2 id="question-text" class="text-xl md:text-2xl font-semibold text-gray-800 mb-6 min-h-[4rem]">
            <!-- Pregunta se carga aquí -->
        </h2>
        
        <div id="options-container" class="space-y-3 mb-6">
            <!-- Opciones se cargan aquí -->
        </div>

        <div class="flex justify-end h-12">
            <button id="btn-next" onclick="nextQuestion()" class="hidden bg-rose-500 hover:bg-rose-600 text-white font-medium py-2.5 px-6 rounded-xl shadow-md transform hover:scale-105 transition-all duration-300">
                Siguiente ➔
            </button>
        </div>
    </div>

    <div id="screen-result" class="glass-panel w-full max-w-md p-8 text-center screen-transition hide-screen z-10 mx-auto">
        <div class="text-7xl mb-4">💖</div>
        <h1 class="text-4xl md:text-5xl font-bold text-rose-600 mb-2 font-cursive" id="result-title">
            ¡Terminaste!
        </h1>
        
        <div class="bg-white/60 rounded-2xl p-6 my-6 border border-pink-100 shadow-inner">
            <p class="text-sm text-pink-600 uppercase tracking-widest font-bold mb-1">Tu puntaje</p>
            <p class="text-6xl font-black bg-clip-text text-transparent bg-gradient-to-r from-rose-500 to-pink-500 font-cursive" id="final-score">
                0/10
            </p>
        </div>

        <p class="text-4xl md:text-5xl text-rose-600 mb-8 font-bold font-cursive leading-tight" id="result-message">
            <!-- Mensaje dinámico -->
        </p>

        <button onclick="resetQuiz()" class="w-full bg-white border-2 border-rose-400 text-rose-500 hover:bg-rose-50 font-bold py-3.5 px-6 rounded-xl shadow-sm transform hover:scale-105 transition-all duration-300">
            Volver a jugar 🔄
        </button>
    </div>

    <script>
        // Generar corazones de fondo animados
        function createHearts() {
            const container = document.getElementById('hearts-container');
            const emojis = ['❤️', '💖', '💕', '💗', '🥰', '✨'];
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = `${Math.random() * 100}vw`;
                heart.style.animationDuration = `${Math.random() * 5 + 7}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${Math.random() * 1.5 + 1}rem`;
                container.appendChild(heart);
            }
        }
        createHearts();

        // --- DATOS DEL QUIZ ---
        const quizData = [
            {
                question: "¿Cuánto tiempo llevamos de relación actualmente?",
                options: ["2 años y 5 meses", "2 años y 9 meses", "3 años", "2 años y 11 meses"],
                correct: 1
            },
            {
                question: "¿Cuándo cumplimos nuestro tercer año juntos?",
                options: ["En octubre", "En noviembre", "En diciembre", "En enero"],
                correct: 2
            },
            {
                question: "¿Cuál será el primer nombre de nuestra futura hija?",
                options: ["Mía", "Selin", "Luna", "Sofía"],
                correct: 1
            },
            {
                question: "¿Cuál es mi comida favorita en todo el mundo?",
                options: ["El ceviche", "Un buen lomo saltado", "Pizza o comida rápida", "Las pastas"],
                correct: 1
            },
            {
                question: "Si tenemos un fin de semana libre solo para nosotros, ¿qué es lo que yo preferiría hacer?",
                options: ["Quedarnos en casita abrazados viendo películas", "Salir a pasear y comer algo rico", "Ir de viaje o aventura a un lugar nuevo", "Salir de fiesta a bailar"],
                correct: 2
            },
            {
                question: "¿Qué fue lo primero que me llamó la atención o me enamoró de ti cuando nos conocimos?",
                options: ["Tu sonrisa hermosa", "Tus ojos y tu mirada", "Tu sentido del humor", "Lo inteligente y apasionada que eres"],
                correct: 0
            },
            {
                question: "¿Cuál es esa pequeña 'manía' o costumbre que tengo y que tú conoces perfectamente?",
                options: ["Mover la pierna sin parar", "Irme a dormir súper tarde", "Dejar la ropa tirada a veces", "Cantar o silbar de la nada"],
                correct: 3
            },
            {
                question: "Si me dieras a elegir un regalo perfecto ahora mismo, ¿cuál elegiría?",
                options: ["Algo hecho a mano por ti (cartas, manualidades)", "Algo de ropa o zapatillas", "Algo tecnológico", "Una caja enorme de mis dulces favoritos"],
                correct: 0
            },
            {
                question: "¿Cuál es mi género de películas o series favorito para ver?",
                options: ["Acción, superhéroes y explosiones", "Comedia (me encanta reír)", "Terror y suspenso", "Ciencia ficción o documentales"],
                correct: 0
            },
            {
                question: "De todas estas cosas, ¿qué es lo que más valoro y amo de nuestra relación?",
                options: ["La confianza inmensa que nos tenemos", "Cómo nos reímos juntos de cualquier tontería", "Saber que siempre estás ahí apoyándome en todo", "¡Absolutamente todo!"],
                correct: 3
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let userName = "";

        // DOM Elements
        const screens = {
            start: document.getElementById('screen-start'),
            quiz: document.getElementById('screen-quiz'),
            result: document.getElementById('screen-result')
        };
        const dom = {
            username: document.getElementById('username'),
            nameError: document.getElementById('name-error'),
            qCounter: document.getElementById('question-counter'),
            cScore: document.getElementById('current-score'),
            qText: document.getElementById('question-text'),
            options: document.getElementById('options-container'),
            btnNext: document.getElementById('btn-next'),
            rTitle: document.getElementById('result-title'),
            rScore: document.getElementById('final-score'),
            rMsg: document.getElementById('result-message')
        };

        function switchScreen(from, to) {
            from.classList.remove('show-screen');
            from.classList.add('hide-screen');
            setTimeout(() => {
                to.classList.remove('hide-screen');
                to.classList.add('show-screen');
            }, 400); // Wait for fade out
        }

        function startQuiz() {
            const nameVal = dom.username.value.trim();
            if (!nameVal) {
                dom.nameError.classList.remove('hidden');
                dom.username.classList.add('border-rose-500');
                return;
            }
            userName = nameVal;
            dom.nameError.classList.add('hidden');
            dom.username.classList.remove('border-rose-500');
            
            switchScreen(screens.start, screens.quiz);
            loadQuestion();
        }

        function loadQuestion() {
            dom.btnNext.classList.add('hidden');
            dom.options.innerHTML = '';
            
            const q = quizData[currentIdx];
            dom.qCounter.textContent = `${currentIdx + 1}/${quizData.length}`;
            dom.cScore.textContent = score;
            dom.qText.textContent = q.question;

            q.options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left bg-white border border-pink-100 hover:border-pink-300 hover:bg-pink-50 text-gray-700 font-medium py-3.5 px-5 rounded-xl shadow-sm outline-none flex items-center";
                
                // Círculo para el estado
                const circle = document.createElement('span');
                circle.className = "w-6 h-6 rounded-full border-2 border-pink-200 mr-3 flex-shrink-0 flex items-center justify-center text-xs text-transparent transition-colors";
                
                const textSpan = document.createElement('span');
                textSpan.textContent = optText;

                btn.appendChild(circle);
                btn.appendChild(textSpan);

                btn.onclick = () => selectOption(i, btn);
                dom.options.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            const q = quizData[currentIdx];
            const allBtns = dom.options.querySelectorAll('button');
            
            // Disable all
            allBtns.forEach(b => b.disabled = true);

            const isCorrect = selectedIndex === q.correct;
            const circle = selectedBtn.querySelector('span:first-child');

            if (isCorrect) {
                // Correct styling
                selectedBtn.className = "option-btn w-full text-left bg-green-50 border-2 border-green-400 text-green-800 font-medium py-3.5 px-5 rounded-xl shadow-sm flex items-center";
                circle.className = "w-6 h-6 rounded-full border-2 border-green-500 bg-green-500 mr-3 flex-shrink-0 flex items-center justify-center text-white text-xs";
                circle.innerHTML = "✓";
                score++;
                dom.cScore.textContent = score;
            } else {
                // Incorrect styling
                selectedBtn.className = "option-btn w-full text-left bg-red-50 border-2 border-red-400 text-red-800 font-medium py-3.5 px-5 rounded-xl shadow-sm flex items-center";
                circle.className = "w-6 h-6 rounded-full border-2 border-red-500 bg-red-500 mr-3 flex-shrink-0 flex items-center justify-center text-white text-xs";
                circle.innerHTML = "✗";

                // Highlight correct option
                const correctBtn = allBtns[q.correct];
                const correctCircle = correctBtn.querySelector('span:first-child');
                correctBtn.className = "option-btn w-full text-left bg-green-50 border-2 border-green-400 text-green-800 font-medium py-3.5 px-5 rounded-xl shadow-sm flex items-center opacity-80";
                correctCircle.className = "w-6 h-6 rounded-full border-2 border-green-500 bg-green-500 mr-3 flex-shrink-0 flex items-center justify-center text-white text-xs";
                correctCircle.innerHTML = "✓";
            }

            if (currentIdx === quizData.length - 1) {
                dom.btnNext.textContent = "Ver resultados ❤️";
            }
            dom.btnNext.classList.remove('hidden');
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                // Fade out question content slightly
                dom.qText.style.opacity = '0';
                dom.options.style.opacity = '0';
                
                setTimeout(() => {
                    loadQuestion();
                    dom.qText.style.opacity = '1';
                    dom.options.style.opacity = '1';
                    dom.qText.style.transition = 'opacity 0.3s ease';
                    dom.options.style.transition = 'opacity 0.3s ease';
                }, 300);
            } else {
                showResults();
            }
        }

        function showResults() {
            dom.rTitle.textContent = `¡Terminaste!`;
            dom.rScore.textContent = `${score}/10`;

            // Mensaje final personalizado y muy romántico
            dom.rMsg.textContent = `${userName}, quiero todo contigo mi amor`;

            switchScreen(screens.quiz, screens.result);
        }

        function resetQuiz() {
            currentIdx = 0;
            score = 0;
            userName = "";
            dom.username.value = "";
            dom.btnNext.textContent = "Siguiente ➔";
            switchScreen(screens.result, screens.start);
        }

        // Enter key support for input
        dom.username.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startQuiz();
        });
    </script>
</body>
</html>
